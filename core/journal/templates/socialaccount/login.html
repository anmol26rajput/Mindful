{% extends "journal/base.html" %}
{% load i18n %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-panel-premium p-4 p-md-5 shadow-soft">
            <div class="text-center mb-4">
                <span style="font-size: 2rem;">🌿</span>
                <h2 class="serif fw-bold mt-2">{% trans "Sign In" %}</h2>
                <p class="text-muted">{% blocktrans with provider.name as provider %}You are about to sign in using a
                    third-party account from {{ provider }}.{% endblocktrans %}</p>
            </div>

            <form method="post" class="d-grid">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold">
                    {% trans "Continue" %} <span class="ms-1">→</span>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
