{% extends 'journal/base.html' %}

{% block content %}
<div class="row min-vh-50 align-items-center justify-content-center">
    <div class="col-md-6 text-center">
        <div class="glass-panel-premium p-5 fade-in">
            <div class="display-1 mb-3">📧</div>
            <h2 class="fw-bold serif mb-3">Check your Inbox</h2>
            <p class="text-muted mb-4">We've emailed you instructions for setting your password, if an account exists
                with the email you entered.</p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary rounded-pill px-5 py-2 fw-bold hover-lift">Back
                to Login</a>
        </div>
    </div>
</div>
{% endblock %}
