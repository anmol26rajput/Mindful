{% extends 'journal/base.html' %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4 fade-in">
            <h2 class="serif fw-bold">Change Email</h2>
            <p class="text-muted small">Enter your new email address below.</p>
        </div>

        <div class="card glass-panel-premium p-4 shadow-soft">
            <div class="card-body">
                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}

                    <div class="text-start">
                        <label class="form-label small fw-bold text-muted ms-1">New Email Address</label>
                        {{ form.new_email }}
                        {% if form.errors %}
                        <div class="text-danger small mt-1 ms-1">
                            {{ form.errors.new_email.0 }}
                        </div>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 shadow-sm">
                        Update Email
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'profile_overview' %}" class="text-muted text-decoration-none small">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
