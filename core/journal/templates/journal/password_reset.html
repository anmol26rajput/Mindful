{% extends 'journal/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row min-vh-50 align-items-center justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel-premium p-5 fade-in">
            <h2 class="fw-bold serif mb-3 text-center">Reset Password</h2>
            <p class="text-muted text-center mb-4 small">Enter your email address and we'll send you a link to reset
                your password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold hover-lift">Send Reset
                        Link</button>
                    <a href="{% url 'login' %}" class="btn btn-link text-muted mt-2">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
