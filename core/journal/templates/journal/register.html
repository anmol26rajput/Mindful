{% extends 'journal/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-panel text-center">
            <h2 class="mb-3">Join MindfulTrack</h2>
            <form method="post" class="text-start">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-4">Sign Up</button>
            </form>
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    document.querySelectorAll('input[type="password"]').forEach(function (input) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'input-group';
                        input.parentNode.insertBefore(wrapper, input);
                        wrapper.appendChild(input);

                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'btn btn-outline-secondary';
                        toggleBtn.type = 'button';
                        toggleBtn.style.cursor = 'pointer';

                        // Icons
                        const eyeIcon = `
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>`;

                        const eyeSlashIcon = `
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
                                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
                                <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s3-5.5 8-5.5c1.724 0 3.298.582 4.514 1.578l-4.514 4.515z"/>
                                <path d="M1.646 1.646a.5.5 0 0 1 .708 0l12 12a.5.5 0 0 1-.708.708l-12-12a.5.5 0 0 1 0-.708z"/>
                            </svg>`;

                        toggleBtn.innerHTML = eyeIcon;

                        toggleBtn.addEventListener('click', function () {
                            const isPassword = input.getAttribute('type') === 'password';
                            input.setAttribute('type', isPassword ? 'text' : 'password');
                            toggleBtn.innerHTML = isPassword ? eyeSlashIcon : eyeIcon;
                        });

                        wrapper.appendChild(toggleBtn);
                    });
                });
            </script>
            <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
