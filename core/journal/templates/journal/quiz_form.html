{% extends 'journal/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-panel">
            <h3 class="fw-bold mb-3 text-center">🧠 Quick Survey</h3>
            <p class="text-center text-muted mb-4">Understanding your "Why" is the first step.</p>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">Finish Setup & Go to Dashboard</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
