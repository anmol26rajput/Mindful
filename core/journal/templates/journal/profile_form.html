{% extends 'journal/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-panel">
            <h3 class="fw-bold mb-3 text-center">👤 Complete Your Profile</h3>
            <p class="text-center text-muted mb-4">Let's get to know you better to help you succeed.</p>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">Next Step: Questionnaire →</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
