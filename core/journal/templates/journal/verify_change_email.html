{% extends 'journal/base.html' %}

{% block content %}
<div class="row min-vh-100 align-items-center justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4 fade-in">
            <div class="d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 60px; height: 60px; background: var(--accent-primary); border-radius: 50%;">
                <span style="font-size: 1.8rem;">🔒</span>
            </div>
            <h2 class="serif fw-bold">Security Check</h2>
            <p class="text-muted small">Verify your identity to change your email.</p>
        </div>

        <div class="card glass-panel-premium p-4 shadow-soft">
            <div class="card-body">
                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}

                    <div class="text-start">
                        <label class="form-label small fw-bold text-muted ms-1">Enter Verification Code</label>
                        {{ form.code }}
                        {% if form.errors %}
                        <div class="text-danger small mt-1 ms-1">
                            {{ form.errors.code.0 }}
                        </div>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 shadow-sm">
                        Verify Identity <span class="ms-1">→</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'profile_overview' %}" class="text-muted text-decoration-none small">← Back to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
